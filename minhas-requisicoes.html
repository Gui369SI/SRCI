<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SRCI — Minhas Requisições</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/styles.css"/>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/minhas-requisicoes.js"></script>
</head>
<body>

  <div class="app-layout">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <header class="app-topbar">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button class="mobile-menu-toggle" onclick="toggleSidebar()">
            <span class="material-symbols-outlined">menu</span>
          </button>
          <h1 class="topbar-title">Histórico de Requisições</h1>
        </div>
        <a href="requisitar.html" class="btn btn-primary btn-sm">
          <span class="material-symbols-outlined">add</span>
          <span>Nova Requisição</span>
        </a>
      </header>

      <div class="app-content">
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Acompanhamento dos Meus Pedidos</h2>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
              <label for="filter-status" style="font-size: 0.75rem; font-weight: 600; color: var(--color-text-muted);">Filtrar por Status:</label>
              <select id="filter-status" class="form-control" style="width: auto; height: 32px; font-size: 0.75rem;" onchange="loadMinhasRequisicoes()">
                <option value="todos">Todos</option>
                <option value="pendente">Pendente</option>
                <option value="aprovada">Aprovada</option>
                <option value="entregue">Entregue</option>
                <option value="rejeitada">Rejeitada</option>
                <option value="cancelada">Cancelada</option>
              </select>
            </div>
          </div>

          <div id="minhas-reqs-container">
            <div class="empty-state">
              <span class="material-symbols-outlined">sync</span>
              <p>Carregando histórico de requisições...</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('app-sidebar');
      if (sidebar) sidebar.classList.toggle('open');
    }
  </script>
</body>
</html>
