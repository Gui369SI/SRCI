<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SRCI — Consulta de Estoque</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/styles.css"/>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/estoque.js"></script>
</head>
<body>

  <div class="app-layout">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <header class="app-topbar">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button class="mobile-menu-toggle" onclick="toggleSidebar()">
            <span class="material-symbols-outlined">menu</span>
          </button>
          <h1 class="topbar-title">Consulta de Insumos &amp; Estoque</h1>
        </div>
        <div id="gestor-actions" style="display: none;">
          <button class="btn btn-primary btn-sm" onclick="openModalNovoItem()">
            <span class="material-symbols-outlined">add</span>
            <span>Cadastrar Novo Insumo</span>
          </button>
        </div>
      </header>

      <div class="app-content">
        <!-- Stock Filter & Search Controls -->
        <div class="card" style="margin-bottom: 1rem;">
          <div style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between;">
            <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; flex-grow: 1;">
              <input type="text" id="search-item" class="form-control" style="max-width: 280px;" placeholder="Buscar insumo por nome..." oninput="filterEstoqueTable()"/>

              <select id="filter-categoria" class="form-control" style="width: auto;" onchange="filterEstoqueTable()">
                <option value="todas">Todas as Categorias</option>
                <option value="Papel">Papel</option>
                <option value="Toner">Toner</option>
                <option value="Mouse">Mouse</option>
                <option value="Teclado">Teclado</option>
                <option value="Outros">Outros</option>
              </select>

              <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.8125rem; cursor: pointer; font-weight: 600; color: var(--color-primary);">
                <input type="checkbox" id="chk-apenas-criticos" onchange="filterEstoqueTable()"/>
                Exibir apenas itens em estoque crítico
              </label>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Saldos do Inventário (vw_estoque)</h2>
            <span id="total-itens-badge" class="badge-status badge-aprovada">Total: 0 itens</span>
          </div>

          <div id="estoque-container">
            <div class="empty-state">
              <span class="material-symbols-outlined">sync</span>
              <p>Carregando dados do estoque...</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal de Cadastro / Edição de Item no Catálogo (Almoxarife / Admin) -->
  <div id="modal-item" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modal-item-title" class="modal-title">Cadastrar Novo Insumo</h3>
        <button type="button" class="btn btn-sm btn-secondary btn-icon" onclick="closeModalItem()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <form id="form-item" onsubmit="handleSaveItem(event)">
        <div class="modal-body">
          <input type="hidden" id="item-id" />

          <div class="form-group">
            <label class="form-label" for="item-nome">Nome do Insumo *</label>
            <input type="text" id="item-nome" class="form-control" required placeholder="Ex.: Resma A4 75g / Toner HP 85A" />
          </div>

          <div class="form-group">
            <label class="form-label" for="item-categoria">Categoria *</label>
            <select id="item-categoria" class="form-control" required>
              <option value="Papel">Papel</option>
              <option value="Toner">Toner</option>
              <option value="Mouse">Mouse</option>
              <option value="Teclado">Teclado</option>
              <option value="Outros">Outros</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="item-unidade">Unidade de Medida *</label>
            <input type="text" id="item-unidade" class="form-control" required placeholder="Ex.: resma, un, cartucho, caixa" />
          </div>

          <div class="form-group">
            <label class="form-label" for="item-minimo">Estoque Mínimo (Alerta de Segurança) *</label>
            <input type="number" id="item-minimo" class="form-control" min="0" value="5" required />
          </div>

          <div class="form-group" id="group-ativo" style="display: none;">
            <label class="form-label" style="flex-direction: row; justify-content: flex-start; gap: 0.5rem; cursor: pointer;">
              <input type="checkbox" id="item-ativo" checked />
              <span>Insumo Ativo no Catálogo</span>
            </label>
          </div>

          <div id="modal-item-alert" class="alert-box alert-danger" style="display: none;"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModalItem()">Cancelar</button>
          <button type="submit" id="btn-save-item" class="btn btn-primary">
            <span class="material-symbols-outlined">save</span>
            <span>Salvar Insumo</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('app-sidebar');
      if (sidebar) sidebar.classList.toggle('open');
    }
  </script>
</body>
</html>
