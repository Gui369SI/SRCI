<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SRCI — Entradas de Compras &amp; Baixas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/styles.css"/>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/entradas.js"></script>
</head>
<body>

  <div class="app-layout">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <header class="app-topbar">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button class="mobile-menu-toggle" onclick="toggleSidebar()">
            <span class="material-symbols-outlined">menu</span>
          </button>
          <h1 class="topbar-title">Gestão do Almoxarifado: Entradas &amp; Entregas</h1>
        </div>
      </header>

      <div class="app-content">
        <!-- Secao 1: Entregas Pendentes (Baixa de Requisições Aprovadas) -->
        <div class="card" style="margin-bottom: 1.5rem;">
          <div class="card-header">
            <h2 class="card-title">Requisições Aprovadas Aguardando Entrega Físicas</h2>
            <span id="aprovadas-count-badge" class="badge-status badge-aprovada">0 Aprovadas</span>
          </div>

          <div id="entregas-container">
            <div class="empty-state">
              <span class="material-symbols-outlined">sync</span>
              <p>Carregando requisições aprovadas...</p>
            </div>
          </div>
        </div>

        <!-- Secao 2: Form de Entrada de Compras (Reposicionamento de Estoque) -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem;">
          <div class="card" style="margin-bottom: 0;">
            <div class="card-header">
              <h2 class="card-title">Registrar Entrada de Compras / Reposição</h2>
            </div>

            <div id="entrada-alert" class="alert-box alert-danger" style="display: none;"></div>
            <div id="entrada-success" class="alert-box alert-success" style="display: none;"></div>

            <form id="form-entrada" onsubmit="handleRegistrarEntradaSubmit(event)">
              <div class="form-group">
                <label class="form-label" for="select-entrada-item">Insumo Recebido *</label>
                <select id="select-entrada-item" class="form-control" required>
                  <option value="">Carregando itens...</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="input-entrada-quantidade">Quantidade Adicionada *</label>
                <input type="number" id="input-entrada-quantidade" class="form-control" min="1" value="1" required />
              </div>

              <div class="form-group">
                <label class="form-label" for="input-entrada-obs">Nota Fiscal / Observação</label>
                <textarea id="input-entrada-obs" class="form-control" placeholder="Ex.: NF 12345 - Reposição Trimestral de Papel A4"></textarea>
              </div>

              <button type="submit" id="btn-submit-entrada" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                <span class="material-symbols-outlined">add_shopping_cart</span>
                <span>Registrar Entrada no Saldo</span>
              </button>
            </form>
          </div>

          <!-- Secao 3: Histórico Recente de Entradas -->
          <div class="card" style="margin-bottom: 0;">
            <div class="card-header">
              <h2 class="card-title">Últimas Entradas Registradas</h2>
            </div>

            <div id="historico-entradas-container">
              <div class="empty-state">
                <span class="material-symbols-outlined">sync</span>
                <p>Carregando histórico de entradas...</p>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('app-sidebar');
      if (sidebar) sidebar.classList.toggle('open');
    }
  </script>
</body>
</html>
