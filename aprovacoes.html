<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SRCI — Fila de Aprovação</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/styles.css"/>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/aprovacoes.js"></script>
</head>
<body>

  <div class="app-layout">
    <aside id="app-sidebar" class="app-sidebar"></aside>

    <main class="app-main">
      <header class="app-topbar">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button class="mobile-menu-toggle" onclick="toggleSidebar()">
            <span class="material-symbols-outlined">menu</span>
          </button>
          <h1 class="topbar-title">Fila de Aprovação de Insumos</h1>
        </div>
      </header>

      <div class="app-content">
        <div class="card">
          <div class="card-header">
            <h2 class="card-title" id="aprovacoes-header-title">Requisições Pendentes do Setor</h2>
            <span id="setor-badge" class="badge-status badge-pendente">Setor: Geral</span>
          </div>

          <div id="aprovacoes-container">
            <div class="empty-state">
              <span class="material-symbols-outlined">sync</span>
              <p>Carregando requisições pendentes...</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal de Rejeição de Requisição -->
  <div id="modal-rejeitar" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title">Rejeitar Requisição <span id="modal-req-id"></span></h3>
        <button type="button" class="btn btn-sm btn-secondary btn-icon" onclick="closeModalRejeitar()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="motivo-rejeicao">Motivo Obrigatório da Rejeição *</label>
          <textarea id="motivo-rejeicao" class="form-control" required placeholder="Informe detalhadamente a razão do indeferimento..."></textarea>
        </div>
        <div id="modal-alert" class="alert-box alert-danger" style="display: none;"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModalRejeitar()">Cancelar</button>
        <button type="button" id="btn-confirm-rejeitar" class="btn btn-danger" onclick="confirmarRejeicao()">
          <span class="material-symbols-outlined">block</span>
          <span>Confirmar Rejeição</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('app-sidebar');
      if (sidebar) sidebar.classList.toggle('open');
    }
  </script>
</body>
</html>
